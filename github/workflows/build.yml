4
Crear la configuración de la app
Ruta: app/build.gradle
Crea un archivo nuevo escribiendo la ruta completa app/build.gradle y pega esto:

Groovy


plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.narutolauncher'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.narutolauncher"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
}
