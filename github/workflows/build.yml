YAML


name: Compilar APK Naruto
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2

      - name: Dar permisos a Gradle
        run: chmod +x gradlew || true

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v3
        with:
          name: app-naruto-debug
          path: app/build/outputs/apk/debug/app-debug.apk
Verification: El archivo se guarda correctamente dentro de la carpeta .github/workflows.

